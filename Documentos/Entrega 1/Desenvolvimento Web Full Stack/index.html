<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acadêmico | KFKA Tech</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        .top-navbar {
            width: 100%;
            height: 70px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .nav-brand {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--kfka-cyan);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .top-help-btn {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.45rem 1.2rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .top-help-btn:hover {
            border-color: var(--kfka-cyan);
            color: var(--kfka-cyan);
        }

        .floating-sidebar {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            z-index: 10;
        }

        .floating-icon {
            width: 45px;
            height: 45px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .floating-icon:hover, .floating-icon.active {
            color: var(--text-main);
            background-color: var(--bg-surface-hover);
            border-color: var(--kfka-cyan);
        }

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 70px;
            padding: 2rem;
        }

        .login-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 2.2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 390px;
            box-shadow: var(--shadow);
        }

        .login-header {
            margin-bottom: 1.3rem;
        }

        .login-header h1 {
            font-size: 1.15rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .login-header p {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.73rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.85rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-main);
            font-size: 0.83rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--kfka-cyan);
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.2);
        }

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
        }

        .password-header label {
            margin-bottom: 0;
        }

        .forgot-password {
            font-size: 0.72rem;
            color: var(--kfka-cyan);
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-login {
            background-color: var(--kfka-cyan);
            color: #0a0c10;
            border: none;
            width: 100%;
            padding: 0.7rem;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.4rem;
        }

        .btn-login:hover {
            background-color: #38bdf8;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        @media (max-width: 768px) {
            .nav-title { display: none; }
            .top-navbar { padding: 0 1rem; }
            .floating-sidebar {
                position: static;
                flex-direction: row;
                justify-content: center;
                width: 100%;
                margin-top: 85px;
                margin-bottom: -1rem;
                transform: none;
            }
            .floating-icon { width: 40px; height: 40px; }
            .login-container { margin-top: 10px; padding: 1rem; }
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="index.html" class="nav-brand">KFKA</a>
            <span class="nav-title">Plataforma Educacional // Ensino Fundamental</span>
        </div>
        <button class="top-help-btn" onclick="alert('Suporte KFKA Tech: Contacte a secretaria escolar para apoio técnico.')">Ajuda</button>
    </header>

    <!-- Ícones flutuantes corrigidos: Casinha vai para o início, Seta volta no histórico, Vermelho limpa e sai -->
    <nav class="floating-sidebar">
        <a href="index.html" class="floating-icon active" title="Início">&#8962;</a>
        <a href="#" class="floating-icon" title="Voltar" onclick="history.back(); return false;">&#8592;</a>
        <a href="index.html" class="floating-icon" title="Sair" style="color: #ef4444;" onclick="localStorage.clear();">&#10162;</a>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Acesso ao Sistema</h1>
                <p>Selecione o seu perfil para entrar no módulo correspondente.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="perfil">Perfil de Acesso</label>
                    <select id="perfil" class="form-control" required>
                        <option value="" disabled selected>Selecione um módulo...</option>
                        <option value="professor">Módulo Professor</option>
                        <option value="admin">Módulo Administrador</option>
                        <option value="responsavel">Módulo Pai / Responsável</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Identificação / E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="nome@escola.com" required>
                </div>

                <div class="form-group">
                    <div class="password-header">
                        <label for="senha">Insira sua Senha</label>
                        <a href="#" class="forgot-password" onclick="alert('Instruções de recuperação enviadas para o e-mail.')">Esqueci a senha</a>
                    </div>
                    <input type="password" id="senha" class="form-control" placeholder="Abcd$23..." required>
                </div>

                <button type="submit" class="btn-login">Acessar Plataforma</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const perfil = document.getElementById('perfil').value;

            // Redirecionamento rigoroso baseado na opção escolhida no <select>
            if (perfil === 'professor') {
                window.location.href = 'professor.html';
            } else if (perfil === 'admin') {
                window.location.href = 'admin.html';
            } else if (perfil === 'responsavel') {
                window.location.href = 'responsavel.html';
            } else {
                alert('Por favor, selecione um perfil de acesso válido.');
            }
        });
    </script>
</body>
</html>
